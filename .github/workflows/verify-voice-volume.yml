name: Verify voice volume
on:
  push:
    branches: ["fix/volumen-ajustable"]
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt faster-whisper
      - run: python -m py_compile campaign_ui.py
      - name: Verify speech and levels
        run: |
          python - <<'PY'
          import array, io, wave, math
          from pathlib import Path
          from piper import SynthesisConfig
          from campaign_ui import _piper_voice, generate_piper_preview
          from faster_whisper import WhisperModel
          text = "Hola, esta es una prueba de voz de REDIAL."
          raw = io.BytesIO()
          with wave.open(raw, "wb") as w:
              _piper_voice("es-MX", "Ald").synthesize_wav(text,w,syn_config=SynthesisConfig(length_scale=1.0))
          normal=generate_piper_preview(text,"es-MX",1.0,"Ald",3.0)
          data=generate_piper_preview(text,"es-MX",1.0,"Ald",6.0)
          def levels(data):
              with wave.open(io.BytesIO(data),"rb") as w:
                  values=array.array("h",w.readframes(w.getnframes()))
                  assert w.getsampwidth()==2
                  return math.sqrt(sum(int(x)*int(x) for x in values)/len(values)), max(abs(int(x)) for x in values)
          before=levels(raw.getvalue()); normal_level=levels(normal); after=levels(data)
          print("RMS before/after:", before[0], after[0], "peak:",after[1])
          assert after[0]>normal_level[0] and normal_level[0]>before[0]*1.1
          assert after[1] < 32767
          Path("speech.wav").write_bytes(data)
          segments,_=WhisperModel("tiny", device="cpu", compute_type="int8").transcribe("speech.wav",language="es",beam_size=5)
          transcript=" ".join(s.text for s in segments).lower()
          print("Transcription:", transcript)
          assert "prueba" in transcript and "voz" in transcript
          PY
